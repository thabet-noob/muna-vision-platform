version: "3.9"
services:
  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    env_file: .env
    ports: ["8050:8050"]
    volumes:
      - ./volumes/model_store:/app/models
      - ./volumes/history:/app/history
      - ./volumes/inference_data:/app/inference_data
    depends_on: [inference_api]
    restart: unless-stopped

  inference_api:
    build:
      context: .
      dockerfile: services/inference_service/Dockerfile
    env_file: .env
    ports: ["8001:8001"]
    volumes:
      - ./volumes/model_store:/app/models
      - ./volumes/history:/app/history
      - ./volumes/inference_data:/app/inference_data
    restart: unless-stopped

  monitoring_api:
    build:
      context: .
      dockerfile: services/monitoring_service/Dockerfile
    env_file: .env
    ports: ["8002:8002"]
    volumes:
      - ./volumes/model_store:/app/models
      - ./volumes/history:/app/history
    restart: unless-stopped

  trainer:
    build:
      context: .
      dockerfile: services/training_service/Dockerfile
    env_file: .env
    volumes:
      - ./volumes/model_store:/app/models
      - ./volumes/history:/app/history
    command: ["python","-m","services.training_service.train"]
    restart: "no"

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    env_file: .env
    volumes:
      - ./volumes/model_store:/app/models
      - ./volumes/history:/app/history
    depends_on: [trainer, inference_api, monitoring_api]
    restart: unless-stopped
